<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="The Unit Conversion Cookbook">
  <defs>
    <!-- Background gradient: warm kitchen tones -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0e2e"/>
      <stop offset="50%"  stop-color="#1e1438"/>
      <stop offset="100%" stop-color="#2a1a3e"/>
    </linearGradient>

    <!-- Warm glow for the central cookbook -->
    <radialGradient id="cookGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%"  stop-color="#f6ad55" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#f6ad55" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f6ad55" stop-opacity="0"/>
    </radialGradient>

    <!-- EU dashboard accent -->
    <linearGradient id="euGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#38a89d"/>
    </linearGradient>

    <!-- US dashboard accent -->
    <linearGradient id="usGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#e8963a"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>

    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow glow -->
    <filter id="arrowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Central warm glow -->
  <circle cx="960" cy="520" r="500" fill="url(#cookGlow)"/>

  <!-- Subtle stars -->
  <g fill="#ffffff" fill-opacity="0.45">
    <circle cx="100"  cy="100" r="1.2"/>
    <circle cx="300"  cy="60"  r="1"/>
    <circle cx="500"  cy="190" r="1.5"/>
    <circle cx="1450" cy="80"  r="1.3"/>
    <circle cx="1650" cy="150" r="1"/>
    <circle cx="1800" cy="90"  r="1.6"/>
    <circle cx="80"   cy="900" r="1.1"/>
    <circle cx="1850" cy="950" r="1.2"/>
    <circle cx="400"  cy="1000" r="1"/>
    <circle cx="1550" cy="1020" r="1.4"/>
  </g>

  <!-- ===================== TITLE ===================== -->
  <g transform="translate(960,140)">
    <text x="0" y="0" text-anchor="middle"
          font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="90" font-weight="800" fill="#ffffff" letter-spacing="-2">
      The Unit Conversion
    </text>
    <text x="0" y="90" text-anchor="middle"
          font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="90" font-weight="800" fill="#f6ad55" letter-spacing="-2">
      Cookbook
    </text>
    <text x="0" y="145" text-anchor="middle"
          font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="36" font-weight="400" fill="#a78bfa" letter-spacing="3">
      from engineering units to SI and back
    </text>
  </g>

  <!-- ===================== LEFT: EU DASHBOARD ===================== -->
  <g transform="translate(100,380)">
    <!-- Dashboard card -->
    <rect width="480" height="420" rx="20" ry="20"
          fill="#12162e" stroke="#4fd1c5" stroke-width="2.5" stroke-opacity="0.8" filter="url(#softShadow)"/>
    <!-- Header bar -->
    <rect width="480" height="48" rx="20" ry="20" fill="#1a1f3d"/>
    <rect y="30" width="480" height="18" fill="#1a1f3d"/>
    <text x="240" y="34" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#4fd1c5">🇪🇺 EUROPEAN DASHBOARD</text>

    <!-- Speedometer -->
    <g transform="translate(100,140)">
      <text x="0" y="0" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#e6edf3">108</text>
      <text x="170" y="0" font-family="Menlo, Consolas, monospace" font-size="24" fill="#4fd1c5">km/h</text>
    </g>

    <!-- Temperature -->
    <g transform="translate(100,220)">
      <text x="0" y="0" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#e6edf3">22</text>
      <text x="100" y="0" font-family="Menlo, Consolas, monospace" font-size="24" fill="#4fd1c5">°C</text>
    </g>

    <!-- Fuel -->
    <g transform="translate(100,300)">
      <text x="0" y="0" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#e6edf3">6.0</text>
      <text x="150" y="0" font-family="Menlo, Consolas, monospace" font-size="24" fill="#4fd1c5">L/100km</text>
    </g>

    <!-- Conversion labels -->
    <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#8892b0">
      <text x="100" y="160">to_kmh(speed)</text>
      <text x="100" y="240">to_degC(T)</text>
    </g>
  </g>

  <!-- ===================== CENTER: SI CORE ===================== -->
  <g transform="translate(660,440)">
    <!-- Central code card -->
    <rect width="600" height="340" rx="20" ry="20"
          fill="#12162e" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.7" filter="url(#softShadow)"/>
    <!-- Header bar -->
    <rect width="600" height="48" rx="20" ry="20" fill="#1a1f3d"/>
    <rect y="30" width="600" height="18" fill="#1a1f3d"/>
    <circle cx="26" cy="24" r="7" fill="#ff5f56"/>
    <circle cx="50" cy="24" r="7" fill="#ffbd2e"/>
    <circle cx="74" cy="24" r="7" fill="#27c93f"/>
    <text x="570" y="30" text-anchor="end" font-family="Menlo, Consolas, monospace"
          font-size="16" fill="#8892b0">physics.mo</text>

    <!-- SI Code -->
    <g font-family="Menlo, Consolas, monospace" font-size="26" fill="#e6edf3">
      <text x="32" y="100"><tspan fill="#c792ea">SI.Velocity</tspan> speed</text>
      <text x="32" y="140" fill="#8892b0" font-size="20">  = 30;       // m/s</text>
      <text x="32" y="190"><tspan fill="#c792ea">SI.Temperature</tspan> T</text>
      <text x="32" y="230" fill="#8892b0" font-size="20">  = 295.15;   // K</text>
      <text x="32" y="280"><tspan fill="#c792ea">SI.Pressure</tspan> p</text>
      <text x="32" y="310" fill="#8892b0" font-size="20">  = 250000;   // Pa</text>
    </g>
  </g>

  <!-- ===================== RIGHT: US DASHBOARD ===================== -->
  <g transform="translate(1340,380)">
    <!-- Dashboard card -->
    <rect width="480" height="420" rx="20" ry="20"
          fill="#12162e" stroke="#f6ad55" stroke-width="2.5" stroke-opacity="0.8" filter="url(#softShadow)"/>
    <!-- Header bar -->
    <rect width="480" height="48" rx="20" ry="20" fill="#1a1f3d"/>
    <rect y="30" width="480" height="18" fill="#1a1f3d"/>
    <text x="240" y="34" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#f6ad55">🇺🇸 AMERICAN DASHBOARD</text>

    <!-- Speedometer -->
    <g transform="translate(100,140)">
      <text x="0" y="0" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#e6edf3">67</text>
      <text x="120" y="0" font-family="Menlo, Consolas, monospace" font-size="24" fill="#f6ad55">mph</text>
    </g>

    <!-- Temperature -->
    <g transform="translate(100,220)">
      <text x="0" y="0" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#e6edf3">72</text>
      <text x="100" y="0" font-family="Menlo, Consolas, monospace" font-size="24" fill="#f6ad55">°F</text>
    </g>

    <!-- Fuel -->
    <g transform="translate(100,300)">
      <text x="0" y="0" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#e6edf3">39</text>
      <text x="120" y="0" font-family="Menlo, Consolas, monospace" font-size="24" fill="#f6ad55">mpg</text>
    </g>

    <!-- Conversion labels -->
    <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#8892b0">
      <text x="100" y="160">to_mph(speed)</text>
      <text x="100" y="240">to_degF(T)</text>
    </g>
  </g>

  <!-- ===================== ARROWS ===================== -->
  <!-- SI → EU (left arrows) -->
  <g stroke="#4fd1c5" stroke-width="3.5" fill="none" opacity="0.8">
    <path d="M 660 560 C 620 560, 600 560, 580 560" stroke-linecap="round"/>
    <polygon points="584,548 560,560 584,572" fill="#4fd1c5" stroke="none"/>
  </g>
  <g opacity="0.3">
    <path d="M 660 560 C 620 560, 600 560, 580 560" stroke="#4fd1c5" stroke-width="8" fill="none" filter="url(#arrowGlow)"/>
  </g>

  <!-- SI → US (right arrows) -->
  <g stroke="#f6ad55" stroke-width="3.5" fill="none" opacity="0.8">
    <path d="M 1260 560 C 1300 560, 1320 560, 1340 560" stroke-linecap="round"/>
    <polygon points="1336,548 1360,560 1336,572" fill="#f6ad55" stroke="none"/>
  </g>
  <g opacity="0.3">
    <path d="M 1260 560 C 1300 560, 1320 560, 1340 560" stroke="#f6ad55" stroke-width="8" fill="none" filter="url(#arrowGlow)"/>
  </g>

  <!-- ===================== BOTTOM: conversion function badges ===================== -->
  <g font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle">
    <!-- from_ functions (incoming) -->
    <g transform="translate(280,920)">
      <rect x="-110" y="-28" width="220" height="56" rx="14" ry="14"
            fill="#1b2552" stroke="#4fd1c5" stroke-width="2" stroke-opacity="0.6"/>
      <text x="0" y="8" fill="#4fd1c5">from_degC()</text>
    </g>
    <g transform="translate(560,920)">
      <rect x="-100" y="-28" width="200" height="56" rx="14" ry="14"
            fill="#1b2552" stroke="#4fd1c5" stroke-width="2" stroke-opacity="0.6"/>
      <text x="0" y="8" fill="#4fd1c5">from_bar()</text>
    </g>
    <g transform="translate(820,920)">
      <rect x="-100" y="-28" width="200" height="56" rx="14" ry="14"
            fill="#1b2552" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.6"/>
      <text x="0" y="8" fill="#a78bfa">from_rpm()</text>
    </g>

    <!-- to_ functions (outgoing) -->
    <g transform="translate(1100,920)">
      <rect x="-100" y="-28" width="200" height="56" rx="14" ry="14"
            fill="#1b2552" stroke="#f6ad55" stroke-width="2" stroke-opacity="0.6"/>
      <text x="0" y="8" fill="#f6ad55">to_degF()</text>
    </g>
    <g transform="translate(1370,920)">
      <rect x="-100" y="-28" width="200" height="56" rx="14" ry="14"
            fill="#1b2552" stroke="#f6ad55" stroke-width="2" stroke-opacity="0.6"/>
      <text x="0" y="8" fill="#f6ad55">to_kmh()</text>
    </g>
    <g transform="translate(1640,920)">
      <rect x="-100" y="-28" width="200" height="56" rx="14" ry="14"
            fill="#1b2552" stroke="#f6ad55" stroke-width="2" stroke-opacity="0.6"/>
      <text x="0" y="8" fill="#f6ad55">to_bar()</text>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="960" y="1040" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="22" fill="#8892b0" letter-spacing="4">
    Modelica.Units.Conversions — from engineering units to SI and back
  </text>
</svg>
