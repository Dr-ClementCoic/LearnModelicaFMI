<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient backgrounds -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a3e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Radial glow -->
    <radialGradient id="glow" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filter for soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4fd1c5" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern overlay -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Radial glow -->
  <rect width="1920" height="1080" fill="url(#glow)"/>
  
  <!-- Left card: IVP -->
  <!-- Card background with shadow -->
  <rect x="200" y="280" width="520" height="400" rx="12" fill="#12162e" stroke="#4fd1c5" stroke-width="2" opacity="0.95" filter="url(#softShadow)"/>
  
  <!-- Card content (no blur) -->
  <g>
    <!-- macOS window dots -->
    <circle cx="230" cy="310" r="6" fill="#ff5f56"/>
    <circle cx="260" cy="310" r="6" fill="#ffbd2e"/>
    <circle cx="290" cy="310" r="6" fill="#27c93f"/>
    
    <!-- Title -->
    <text x="330" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3" text-anchor="middle">Initial Value</text>
    <text x="330" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#4fd1c5" text-anchor="middle">Problem (IVP)</text>
    
    <!-- Content -->
    <text x="220" y="460" font-family="Menlo, Consolas, monospace" font-size="16" fill="#a78bfa" font-weight="600">Given:</text>
    <text x="220" y="490" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• Initial state values</text>
    <text x="220" y="520" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• x(t₀) = x₀</text>
    <text x="220" y="550" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• v(t₀) = v₀</text>
    <text x="220" y="580" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• Solver integrates forward</text>
    <text x="220" y="610" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• "What comes next?"</text>
    <text x="220" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#f6ad55" font-style="italic">time marches on ⏭️</text>
  </g>
  
  <!-- Right card: BVP -->
  <!-- Card background with shadow -->
  <rect x="1200" y="280" width="520" height="400" rx="12" fill="#12162e" stroke="#f6ad55" stroke-width="2" opacity="0.95" filter="url(#softShadow)"/>
  
  <!-- Card content (no blur) -->
  <g>
    <!-- macOS window dots -->
    <circle cx="1230" cy="310" r="6" fill="#ff5f56"/>
    <circle cx="1260" cy="310" r="6" fill="#ffbd2e"/>
    <circle cx="1290" cy="310" r="6" fill="#27c93f"/>
    
    <!-- Title -->
    <text x="1460" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3" text-anchor="middle">Boundary Value</text>
    <text x="1460" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f6ad55" text-anchor="middle">Problem (BVP)</text>
    
    <!-- Content -->
    <text x="1220" y="460" font-family="Menlo, Consolas, monospace" font-size="16" fill="#a78bfa" font-weight="600">Given:</text>
    <text x="1220" y="490" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• Constraint equations</text>
    <text x="1220" y="520" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• der(x) = 0  (steady state)</text>
    <text x="1220" y="550" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• System of equations</text>
    <text x="1220" y="580" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• Solver finds balance</text>
    <text x="1220" y="610" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8892b0">• "What satisfies this?"</text>
    <text x="1220" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#4fd1c5" font-style="italic">equilibrium sought ⚖️</text>
  </g>
  
  <!-- Central connector/title -->
  <text x="960" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#e6edf3" text-anchor="middle">IVP vs BVP</text>
  
  <!-- Arrow connector (optional visual) -->
  <line x1="730" y1="480" x2="1190" y2="480" stroke="#a78bfa" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <text x="960" y="505" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle" opacity="0.7">initialization</text>
  
  <!-- Badge row - bottom -->
  <g opacity="0.85">
    <!-- Badge 1 -->
    <rect x="280" y="950" width="200" height="50" rx="8" fill="#12162e" stroke="#4fd1c5" stroke-width="1.5"/>
    <text x="380" y="982" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4fd1c5" text-anchor="middle">Differential Equations</text>
    
    <!-- Badge 2 -->
    <rect x="540" y="950" width="180" height="50" rx="8" fill="#12162e" stroke="#f6ad55" stroke-width="1.5"/>
    <text x="630" y="982" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f6ad55" text-anchor="middle">State Variables</text>
    
    <!-- Badge 3 -->
    <rect x="780" y="950" width="160" height="50" rx="8" fill="#12162e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="860" y="982" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">Initialization</text>
    
    <!-- Badge 4 -->
    <rect x="1010" y="950" width="170" height="50" rx="8" fill="#12162e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1095" y="982" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">Constraints</text>
    
    <!-- Badge 5 -->
    <rect x="1250" y="950" width="200" height="50" rx="8" fill="#12162e" stroke="#4fd1c5" stroke-width="1.5"/>
    <text x="1350" y="982" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4fd1c5" text-anchor="middle">Solver Integration</text>
    
    <!-- Badge 6 -->
    <rect x="1520" y="950" width="130" height="50" rx="8" fill="#12162e" stroke="#f6ad55" stroke-width="1.5"/>
    <text x="1585" y="982" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f6ad55" text-anchor="middle">Spring-Damper</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="1800" y="1050" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8892b0" text-anchor="end" letter-spacing="2">Which one describes your system?</text>
</svg>