<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6dcc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="360" fill="#fafafa" rx="8" />

  <!-- Voltage Source -->
  <circle cx="100" cy="160" r="40" fill="none" stroke="#3b6dcc" stroke-width="2.5" />
  <text x="100" y="155" text-anchor="middle" font-size="24" fill="#3b6dcc" font-weight="700">+</text>
  <text x="100" y="178" text-anchor="middle" font-size="20" fill="#3b6dcc" font-weight="700">−</text>
  <text x="100" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#333">ConstantVoltage</text>
  <text x="100" y="238" text-anchor="middle" font-size="12" fill="#666">V = 12 V</text>

  <!-- Resistor (zigzag) -->
  <path d="M 200,80 L 210,65 L 230,95 L 250,65 L 270,95 L 290,65 L 300,80" 
        fill="none" stroke="#3b6dcc" stroke-width="2.5" stroke-linejoin="round" />
  <text x="250" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Resistor</text>
  <text x="250" y="115" text-anchor="middle" font-size="12" fill="#666">R = 100 Ω</text>

  <!-- Ground symbol -->
  <line x1="100" y1="280" x2="100" y2="310" stroke="#3b6dcc" stroke-width="2.5" />
  <line x1="70" y1="310" x2="130" y2="310" stroke="#3b6dcc" stroke-width="2.5" />
  <line x1="80" y1="320" x2="120" y2="320" stroke="#3b6dcc" stroke-width="2" />
  <line x1="90" y1="330" x2="110" y2="330" stroke="#3b6dcc" stroke-width="1.5" />
  <text x="100" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Ground</text>

  <!-- Wires -->
  <!-- Source p (top) to wire up -->
  <line x1="100" y1="120" x2="100" y2="80" stroke="#3b6dcc" stroke-width="2" />
  <!-- Top wire: source to resistor -->
  <line x1="100" y1="80" x2="200" y2="80" stroke="#3b6dcc" stroke-width="2" />
  <!-- Resistor to right side -->
  <line x1="300" y1="80" x2="400" y2="80" stroke="#3b6dcc" stroke-width="2" />
  <!-- Right side down -->
  <line x1="400" y1="80" x2="400" y2="280" stroke="#3b6dcc" stroke-width="2" />
  <!-- Bottom wire: right to source n -->
  <line x1="400" y1="280" x2="100" y2="280" stroke="#3b6dcc" stroke-width="2" />
  <!-- Source n (bottom) to wire -->
  <line x1="100" y1="200" x2="100" y2="280" stroke="#3b6dcc" stroke-width="2" />

  <!-- Current arrow -->
  <path d="M 150,70 L 180,70" fill="none" stroke="#e85d3a" stroke-width="2" marker-end="url(#arrowI)" />
  <defs>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e85d3a" />
    </marker>
  </defs>
  <text x="165" y="63" text-anchor="middle" font-size="12" font-weight="600" fill="#e85d3a">I</text>

  <!-- P = R·I² annotation -->
  <rect x="310" y="130" width="140" height="50" rx="8" fill="#fff3e0" stroke="#e85d3a" stroke-width="1.5" />
  <text x="380" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#e85d3a">P = R · I² = 1.44 W</text>
  <text x="380" y="170" text-anchor="middle" font-size="12" fill="#999">→ where does it go? 🤔</text>
  <!-- Arrow from resistor to annotation -->
  <line x1="280" y1="95" x2="330" y2="130" stroke="#e85d3a" stroke-width="1.5" stroke-dasharray="4,3" />

</svg>
