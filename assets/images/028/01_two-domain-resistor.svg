<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background zones -->
  <!-- Electrical zone (blue) -->
  <rect x="0" y="160" width="600" height="240" rx="0" fill="#e8f0fe" />
  <text x="20" y="380" font-size="14" fill="#3b6dcc" font-weight="600" opacity="0.7">⚡ Electrical Domain</text>

  <!-- Thermal zone (orange) -->
  <rect x="0" y="0" width="600" height="160" rx="0" fill="#fef0e0" />
  <text x="20" y="30" font-size="14" fill="#c47a20" font-weight="600" opacity="0.7">🔥 Thermal Domain</text>

  <!-- Domain separator line -->
  <line x1="0" y1="160" x2="600" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Central component box -->
  <rect x="200" y="200" width="200" height="100" rx="10" fill="#ffffff" stroke="#444" stroke-width="2.5" />
  <text x="300" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#333">HeatingResistor</text>
  <text x="300" y="272" text-anchor="middle" font-size="13" fill="#666">R · I² → Q</text>

  <!-- Left Pin (pin_p) -->
  <rect x="100" y="232" width="70" height="36" rx="6" fill="#d4e3fc" stroke="#3b6dcc" stroke-width="2" />
  <text x="135" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#3b6dcc">pin_p</text>
  <!-- Connection line left -->
  <line x1="170" y1="250" x2="200" y2="250" stroke="#3b6dcc" stroke-width="2.5" />

  <!-- Right Pin (pin_n) -->
  <rect x="430" y="232" width="70" height="36" rx="6" fill="#d4e3fc" stroke="#3b6dcc" stroke-width="2" />
  <text x="465" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#3b6dcc">pin_n</text>
  <!-- Connection line right -->
  <line x1="400" y1="250" x2="430" y2="250" stroke="#3b6dcc" stroke-width="2.5" />

  <!-- Pin labels -->
  <text x="135" y="286" text-anchor="middle" font-size="11" fill="#555">v, i</text>
  <text x="465" y="286" text-anchor="middle" font-size="11" fill="#555">v, i</text>

  <!-- Heat port (top) -->
  <rect x="265" y="110" width="70" height="36" rx="6" fill="#fddcb0" stroke="#c47a20" stroke-width="2" />
  <text x="300" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="#c47a20">heatPort</text>
  <!-- Connection line up -->
  <line x1="300" y1="146" x2="300" y2="200" stroke="#c47a20" stroke-width="2.5" />

  <!-- Heat port label -->
  <text x="300" y="103" text-anchor="middle" font-size="11" fill="#555">T, Q_flow</text>

  <!-- Effort/Flow annotations -->
  <!-- Left side -->
  <text x="60" y="330" text-anchor="middle" font-size="12" fill="#3b6dcc">
    <tspan x="135" dy="0" font-weight="600">effort:</tspan><tspan> voltage (v)</tspan>
  </text>
  <text x="60" y="348" text-anchor="middle" font-size="12" fill="#3b6dcc">
    <tspan x="135" dy="0" font-weight="600">flow:</tspan><tspan> current (i)</tspan>
  </text>

  <!-- Right side (thermal) -->
  <text x="465" y="330" text-anchor="middle" font-size="12" fill="#c47a20">
    <tspan x="465" dy="0" font-weight="600">effort:</tspan><tspan> temperature (T)</tspan>
  </text>
  <text x="465" y="348" text-anchor="middle" font-size="12" fill="#c47a20">
    <tspan x="465" dy="0" font-weight="600">flow:</tspan><tspan> heat flow (Q̇)</tspan>
  </text>

  <!-- Arrow showing energy conversion -->
  <path d="M300,200 C310,180 310,170 300,160" fill="none" stroke="#e85d3a" stroke-width="2" marker-end="url(#arrowOrange)" />
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e85d3a" />
    </marker>
  </defs>
</svg>
