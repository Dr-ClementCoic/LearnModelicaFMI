<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The useful illusion of correctness header</title>
  <desc id="desc">An abstract object casts two different shadows, representing models that can both appear correct within their domain.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5efe5"/>
      <stop offset="100%" stop-color="#e4ecf2"/>
    </linearGradient>

    <linearGradient id="beamBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f5d7e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2f5d7e" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamOrange" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#d9772d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d9772d" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.35" filter="url(#softBlur)">
    <circle cx="200" cy="140" r="180" fill="#ffffff"/>
    <circle cx="1430" cy="760" r="220" fill="#ffffff"/>
  </g>

  <g>
    <circle cx="250" cy="300" r="26" fill="#2f5d7e"/>
    <circle cx="1350" cy="300" r="26" fill="#d9772d"/>

    <polygon points="276,290 680,390 680,510 276,310" fill="url(#beamBlue)"/>
    <polygon points="1324,290 920,390 920,510 1324,310" fill="url(#beamOrange)"/>
  </g>

  <g>
    <ellipse cx="800" cy="760" rx="360" ry="75" fill="#000000" opacity="0.12"/>

    <rect x="320" y="460" width="260" height="170" rx="18" fill="#d9772d" opacity="0.22"/>
    <rect x="1020" y="430" width="250" height="250" rx="4" fill="#2f5d7e" opacity="0.22"/>

    <g transform="translate(800 470)" filter="url(#bigShadow)">
      <polygon points="-60,-90 70,-40 50,80 -80,30" fill="#335c43"/>
      <polygon points="-60,-90 -5,-145 125,-95 70,-40" fill="#4a7a5c"/>
      <polygon points="70,-40 125,-95 105,25 50,80" fill="#264a35"/>
      <polygon points="-80,30 50,80 105,25 -25,-25" fill="#5c8f6d"/>
    </g>
  </g>

  <g fill="#1f2a33" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="800" y="140" font-size="62" font-weight="700">The Useful Illusion of Correctness</text>
    <text x="800" y="195" font-size="28" opacity="0.9"><tspan x="800" dy="0">Different modeling techniques can be true, while being fundamentally different.</tspan><tspan x="800" dy="38">Neither will be the truth.</tspan></text>
  </g>

  <g fill="#1f2a33" font-family="Verdana, sans-serif" font-size="24" font-weight="600" text-anchor="middle" opacity="0.85">
    <text x="250" y="350">Modeling A</text>
    <text x="1350" y="350">Modeling B</text>
  </g>
</svg>
