<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">The scoreboard — who wins which round</title>
  <desc id="desc">A scoreboard listing five rounds with their problem, the winning style (equation, algorithm, or draw) and a short reason.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f4ea"/>
      <stop offset="100%" stop-color="#eef5fb"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="720" fill="url(#bg)"/>
  <text x="500" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#243238" font-weight="bold">The scoreboard</text>

  <!-- Header row -->
  <g font-family="Georgia, serif" font-size="24" fill="#37474f">
    <text x="70" y="140">Round</text>
    <text x="200" y="140">Problem</text>
    <text x="560" y="140">Winner</text>
    <text x="760" y="140">Why</text>
  </g>
  <line x1="60" y1="160" x2="940" y2="160" stroke="#90a4ae" stroke-width="3"/>

  <!-- Rows -->
  <g font-family="Georgia, serif" font-size="22" fill="#263238">
    <!-- Row 1 -->
    <text x="90" y="215" text-anchor="middle">1</text>
    <text x="200" y="215">Spring force</text>
    <rect x="540" y="193" width="150" height="34" rx="17" fill="#8ee6a8"/>
    <text x="615" y="217" text-anchor="middle" fill="#12341f">equation</text>
    <text x="760" y="215" font-size="19" fill="#546e7a">works both ways</text>

    <!-- Row 2 (placeholder problem) -->
    <text x="90" y="275" text-anchor="middle">2</text>
    <text x="200" y="275">Bisection root</text>
    <rect x="540" y="253" width="150" height="34" rx="17" fill="#8fd3f0"/>
    <text x="615" y="277" text-anchor="middle" fill="#0f2b45">algorithm</text>
    <text x="760" y="275" font-size="19" fill="#546e7a">a converging recipe</text>

    <!-- Row 3 -->
    <text x="90" y="335" text-anchor="middle">3</text>
    <text x="200" y="335">Filtered sum</text>
    <rect x="540" y="313" width="150" height="34" rx="17" fill="#8fd3f0"/>
    <text x="615" y="337" text-anchor="middle" fill="#0f2b45">algorithm</text>
    <text x="760" y="335" font-size="19" fill="#546e7a">a sequence of updates</text>

    <!-- Row 4 -->
    <text x="90" y="395" text-anchor="middle">4</text>
    <text x="200" y="395">Little circuit</text>
    <rect x="540" y="373" width="150" height="34" rx="17" fill="#8ee6a8"/>
    <text x="615" y="397" text-anchor="middle" fill="#12341f">equation</text>
    <text x="760" y="395" font-size="19" fill="#546e7a">tool solves the system</text>

    <!-- Row 5 -->
    <text x="90" y="455" text-anchor="middle">5</text>
    <text x="200" y="455">Saturation</text>
    <rect x="540" y="433" width="150" height="34" rx="17" fill="#ffd166"/>
    <text x="615" y="457" text-anchor="middle" fill="#7a3b00">draw</text>
    <text x="760" y="455" font-size="19" fill="#546e7a">reads fine either way</text>
  </g>

  <line x1="60" y1="490" x2="940" y2="490" stroke="#90a4ae" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Heuristic box -->
  <rect x="60" y="520" width="880" height="150" rx="20" fill="#fff9ef" stroke="#37474f" stroke-width="3"/>
  <text x="90" y="565" font-family="Georgia, serif" font-size="23" fill="#37474f">What is true?  →  reach for <tspan font-family="Courier New, monospace" fill="#1b5e20">equation</tspan></text>
  <text x="90" y="605" font-family="Georgia, serif" font-size="23" fill="#37474f">What to do, in order?  →  reach for <tspan font-family="Courier New, monospace" fill="#0d47a1">algorithm</tspan></text>
  <text x="90" y="645" font-family="Georgia, serif" font-size="23" fill="#37474f">Cannot decide?  →  optimize for readability 😉</text>
</svg>
