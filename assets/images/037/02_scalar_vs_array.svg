<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">each versus per-element array modifiers</title>
  <desc id="ddesc">A single scalar stiffness c is broadcast with the each keyword to every instance of an oscillator array, while an array masses feeds one distinct value to each instance.</desc>
  <rect width="1200" height="560" fill="#f7fbfd"/>

  <!-- The array of instances -->
  <rect x="315" y="250" width="90" height="70" rx="10" fill="#12242c" stroke="rgb(127,237,17)" stroke-width="3"/>
  <circle cx="360" cy="285" r="16" fill="rgb(127,237,17)"/>
  <text x="360" y="342" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#9fb6c0">osc[1]</text>
  <rect x="455" y="250" width="90" height="70" rx="10" fill="#12242c" stroke="rgb(248,100,32)" stroke-width="3"/>
  <circle cx="500" cy="285" r="16" fill="rgb(248,100,32)"/>
  <text x="500" y="342" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#9fb6c0">osc[2]</text>
  <rect x="595" y="250" width="90" height="70" rx="10" fill="#12242c" stroke="rgb(202,0,179)" stroke-width="3"/>
  <circle cx="640" cy="285" r="16" fill="rgb(202,0,179)"/>
  <text x="640" y="342" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#9fb6c0">osc[3]</text>
  <rect x="735" y="250" width="90" height="70" rx="10" fill="#12242c" stroke="rgb(52,75,254)" stroke-width="3"/>
  <circle cx="780" cy="285" r="16" fill="rgb(52,75,254)"/>
  <text x="780" y="342" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#9fb6c0">osc[4]</text>
  <rect x="875" y="250" width="90" height="70" rx="10" fill="#12242c" stroke="rgb(6,222,154)" stroke-width="3"/>
  <circle cx="920" cy="285" r="16" fill="rgb(6,222,154)"/>
  <text x="920" y="342" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#9fb6c0">osc[5]</text>
  <text x="640" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#20343d" font-style="italic">Oscillator osc[n]</text>

  <!-- Scalar broadcast (each) -->
  <rect x="560" y="112" width="160" height="46" rx="12" fill="#e7f2fb" stroke="#3f86c4" stroke-width="2.5"/>
  <text x="640" y="141" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="#245a86">each c = c</text>
  <line x1="640" y1="150" x2="360" y2="244" stroke="#5fb2ec" stroke-width="2" opacity="0.55" stroke-dasharray="4 5"/>
  <line x1="640" y1="150" x2="500" y2="244" stroke="#5fb2ec" stroke-width="2" opacity="0.55" stroke-dasharray="4 5"/>
  <line x1="640" y1="150" x2="640" y2="244" stroke="#5fb2ec" stroke-width="2" opacity="0.55" stroke-dasharray="4 5"/>
  <line x1="640" y1="150" x2="780" y2="244" stroke="#5fb2ec" stroke-width="2" opacity="0.55" stroke-dasharray="4 5"/>
  <line x1="640" y1="150" x2="920" y2="244" stroke="#5fb2ec" stroke-width="2" opacity="0.55" stroke-dasharray="4 5"/>
  <text x="990" y="128" font-family="Georgia, serif" font-size="18" fill="#3f86c4">one value</text>
  <text x="990" y="150" font-family="Georgia, serif" font-size="18" fill="#3f86c4">&#8594; all instances</text>

  <!-- Per-element array -->
  <text x="150" y="450" font-family="Courier New, monospace" font-size="18" fill="#2a7d55">m = masses</text>
  <line x1="360" y1="468" x2="360" y2="328" stroke="#5fd598" stroke-width="2.4" opacity="0.8"/>
  <line x1="500" y1="468" x2="500" y2="328" stroke="#5fd598" stroke-width="2.4" opacity="0.8"/>
  <line x1="640" y1="468" x2="640" y2="328" stroke="#5fd598" stroke-width="2.4" opacity="0.8"/>
  <line x1="780" y1="468" x2="780" y2="328" stroke="#5fd598" stroke-width="2.4" opacity="0.8"/>
  <line x1="920" y1="468" x2="920" y2="328" stroke="#5fd598" stroke-width="2.4" opacity="0.8"/>
  <rect x="320" y="470" width="80" height="42" rx="8" fill="#0e2129" stroke="#5fd598" stroke-width="2"/>
  <text x="360" y="497" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#8ee6a8">0.47</text>
  <rect x="460" y="470" width="80" height="42" rx="8" fill="#0e2129" stroke="#5fd598" stroke-width="2"/>
  <text x="500" y="497" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#8ee6a8">0.52</text>
  <rect x="600" y="470" width="80" height="42" rx="8" fill="#0e2129" stroke="#5fd598" stroke-width="2"/>
  <text x="640" y="497" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#8ee6a8">0.60</text>
  <rect x="740" y="470" width="80" height="42" rx="8" fill="#0e2129" stroke="#5fd598" stroke-width="2"/>
  <text x="780" y="497" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#8ee6a8">0.72</text>
  <rect x="880" y="470" width="80" height="42" rx="8" fill="#0e2129" stroke="#5fd598" stroke-width="2"/>
  <text x="920" y="497" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#8ee6a8">1.01</text>
  <text x="990" y="486" font-family="Georgia, serif" font-size="18" fill="#2a7d55">one value</text>
  <text x="990" y="508" font-family="Georgia, serif" font-size="18" fill="#2a7d55">per instance</text>

  <!-- captions -->
  <text x="640" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#12242c" font-weight="bold">each = same for all &#183; array = one per instance</text>
</svg>
